<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b1e3a">
<meta name="app-version" content="2026-10-09.1">
<title>Ma Cave</title>
<style>
  /* ---------- Couleurs (clair / sombre) ---------- */
  :root {
    --bg:#f8f4f1; --surface:#ffffff; --text:#2b1d20; --muted:#7d6b6e; --border:#ebe1de;
    --accent:#7b1e3a; --on-accent:#ffffff;
    --ok:#2f7d4f; --vite:#b8661b; --passe:#b42a2a; --tot:#6b6f80;
    --shadow:0 1px 3px rgba(43,29,32,.08), 0 4px 14px rgba(43,29,32,.06);
    --c-rouge:#7b1e3a; --c-blanc:#d9c47c; --c-rose:#e99aa6; --c-effervescent:#c9bb72; --c-liquoreux:#cf8b2c;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#17110f; --surface:#221a19; --text:#f3ebe8; --muted:#a8999a; --border:#3a2e2d;
      --accent:#c4466b; --shadow:none; color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#17110f; --surface:#221a19; --text:#f3ebe8; --muted:#a8999a; --border:#3a2e2d;
    --accent:#c4466b; --shadow:none; color-scheme:dark;
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:16px;
    -webkit-font-smoothing:antialiased; padding-bottom:110px;
  }
  .wrap { max-width:720px; margin:0 auto; }

  /* ---------- En-tête ---------- */
  .top { background:var(--accent); color:var(--on-accent); padding:calc(18px + env(safe-area-inset-top)) 16px 18px; }
  h1, h2 { font-family:Georgia, "Times New Roman", serif; font-weight:600; }
  h1 { margin:0; font-size:1.8rem; }
  .stats { margin:4px 0 0; opacity:.85; font-size:.95rem; }

  main { padding:16px; }

  /* ---------- Barre de recherche / filtres ---------- */
  .toolbar { display:grid; gap:10px; margin-bottom:14px; }
  input, select, textarea {
    font:inherit; color:inherit; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; padding:10px 12px; width:100%;
  }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .selects { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .group-h {
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    margin:14px 2px 0; padding-bottom:4px; border-bottom:1px solid var(--border);
  }
  .group-h:first-child { margin-top:0; }
  .group-h h3 { margin:0; font-family:Georgia, "Times New Roman", serif; font-size:1.05rem; font-weight:600; }
  .group-h span { font-size:.82rem; color:var(--muted); white-space:nowrap; }
  .chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .chip {
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:999px; padding:6px 12px; font:inherit; font-size:.9rem; white-space:nowrap; cursor:pointer;
  }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  /* ---------- Liste des bouteilles ---------- */
  .list { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .card {
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow); overflow:hidden;
  }
  .card.epuise { opacity:.5; }
  .card-main {
    flex:1; min-width:0; display:flex; gap:12px; align-items:center; text-align:left;
    background:none; border:0; padding:10px; color:inherit; font:inherit; cursor:pointer;
  }
  .card-main img, .ph { width:56px; height:72px; border-radius:8px; object-fit:cover; flex:none; }
  .ph { display:grid; place-items:center; font-size:1.5rem; background:color-mix(in srgb, var(--c) 25%, var(--surface)); }
  .c-rouge { --c:var(--c-rouge); } .c-blanc { --c:var(--c-blanc); } .c-rose { --c:var(--c-rose); }
  .c-effervescent { --c:var(--c-effervescent); } .c-liquoreux { --c:var(--c-liquoreux); }
  .info { min-width:0; }
  .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cuvee { font-weight:400; color:var(--muted); }
  .sub { color:var(--muted); font-size:.9rem; display:flex; align-items:center; gap:6px; margin-top:2px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--c); flex:none; }
  .badge {
    display:inline-block; margin-top:6px; font-size:.78rem; font-weight:600; padding:2px 8px;
    border-radius:999px; color:var(--b); background:color-mix(in srgb, var(--b) 14%, transparent);
  }
  .badge.ok { --b:var(--ok); } .badge.vite { --b:var(--vite); } .badge.passe { --b:var(--passe); } .badge.tot { --b:var(--tot); }
  .loc { font-size:.8rem; color:var(--muted); margin-top:4px; }
  .qty { display:flex; flex-direction:column; align-items:center; border-left:1px solid var(--border); min-width:52px; }
  .qty button { flex:1; width:100%; background:none; border:0; color:var(--accent); font-size:1.3rem; font-weight:600; cursor:pointer; }
  .qty span { font-weight:700; font-size:1.1rem; }

  .empty { text-align:center; color:var(--muted); padding:40px 16px; }
  .tools { display:flex; justify-content:center; gap:18px; margin-top:28px; }
  .link { background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; font-size:.9rem; cursor:pointer; }

  .fabs {
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex; gap:8px; width:max-content; max-width:calc(100% - 32px);
  }
  .fab {
    background:var(--accent); color:var(--on-accent); border:0; border-radius:999px;
    padding:14px 20px; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap;
    box-shadow:0 6px 20px rgba(123,30,58,.35);
  }
  .fab.alt { background:var(--surface); color:var(--accent); border:1px solid var(--border); }

  /* ---------- Ajout en lot ---------- */
  .lot { padding:18px; display:grid; gap:12px; }
  .lot h2 { margin:0; font-size:1.35rem; }
  .lot .photo-pick { min-height:90px; }
  .progress { height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .progress div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .lot-list { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .lot-item { display:grid; grid-template-columns:auto 1fr; gap:10px; padding:10px; border:1px solid var(--border); border-radius:12px; }
  .lot-item.off { opacity:.45; }
  .lot-item img { width:48px; height:60px; object-fit:cover; border-radius:6px; }
  .lot-side { display:grid; gap:6px; justify-items:center; align-content:start; }
  .lot-side input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); }
  .lot-fields { display:grid; gap:6px; min-width:0; }
  .lot-fields input { padding:7px 9px; font-size:.95rem; }
  .lot-row { display:grid; grid-template-columns:1fr 88px; gap:6px; }
  .lot-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); }
  .lot-qty { display:flex; align-items:center; gap:4px; }
  .lot-qty button { width:30px; height:30px; border-radius:8px; border:0; background:var(--border); color:var(--text); font:inherit; font-weight:700; cursor:pointer; }
  .lot-qty span { min-width:22px; text-align:center; font-weight:700; color:var(--text); }
  .etat-ok { color:var(--ok); } .etat-err { color:var(--passe); }

  /* ---------- Fenêtre d'ajout / modification ---------- */
  dialog {
    border:0; padding:0; border-radius:16px; width:min(560px, calc(100% - 24px));
    max-height:calc(100dvh - 24px); background:var(--surface); color:var(--text);
  }
  dialog::backdrop { background:rgba(20,10,12,.55); }
  form { padding:18px; display:grid; gap:12px; }
  form h2 { margin:0; font-size:1.35rem; }
  .photo-pick {
    display:grid; place-items:center; min-height:130px; border:2px dashed var(--border);
    border-radius:12px; cursor:pointer; overflow:hidden; color:var(--muted); text-align:center; padding:8px;
  }
  .photo-pick img { width:100%; max-height:240px; object-fit:contain; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label.f { display:grid; gap:4px; font-size:.85rem; color:var(--muted); }
  .stepper { display:flex; gap:6px; }
  .stepper input { text-align:center; }
  .btn { border:0; border-radius:10px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
  .stepper .btn { padding:10px 14px; }
  .primary { background:var(--accent); color:var(--on-accent); }
  .secondary { background:var(--border); color:var(--text); }
  .danger { background:none; color:var(--passe); padding-left:0; }
  .actions { display:flex; gap:8px; align-items:center; margin-top:4px; }
  .spacer { flex:1; }

  /* ---------- Recherche du vin ---------- */
  .search-box { display:grid; gap:8px; padding:12px; border-radius:12px; background:color-mix(in srgb, var(--accent) 7%, var(--surface)); border:1px solid color-mix(in srgb, var(--accent) 20%, var(--border)); }
  .search-row { display:flex; gap:8px; }
  .search-row input { flex:1; min-width:0; }
  .search-row .btn { white-space:nowrap; }
  .search-help { font-size:.8rem; color:var(--muted); margin:0; }
  .search-status { font-size:.9rem; margin:0; }
  .search-status.err { color:var(--passe); }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:tourne .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes tourne { to { transform:rotate(360deg); } }
  .btn:disabled { opacity:.6; cursor:wait; }

  .fiche { display:grid; gap:8px; padding:12px; border-radius:12px; border:1px solid var(--border); font-size:.92rem; line-height:1.45; }
  .fiche h3 { margin:0; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .fiche p, .fiche ul { margin:0; }
  .fiche ul { padding-left:18px; }
  .fiche .meta { display:flex; flex-wrap:wrap; gap:6px; }
  .fiche .pill { font-size:.8rem; padding:2px 8px; border-radius:999px; background:var(--border); }
  .fiche a { color:var(--accent); word-break:break-all; font-size:.8rem; }
  .valeur { font-size:.8rem; color:var(--muted); margin-top:4px; }

  @media (max-width:600px) {
    .lot { padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
    dialog { width:100%; max-width:100%; height:100dvh; max-height:100dvh; border-radius:0; margin:0; }
    form { padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>Ma Cave</h1>
    <p class="stats" id="stats"></p>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Rechercher un domaine, une appellation…">
    <div class="chips" id="chips"></div>
    <div class="selects">
      <select id="group" aria-label="Regrouper par">
        <option value="aucun">Sans groupes</option>
        <option value="garde">Boire / garder</option>
        <option value="producteur">Par producteur</option>
        <option value="region">Par région</option>
        <option value="couleur">Par couleur</option>
      </select>
      <select id="sort" aria-label="Trier par">
        <option value="recent">Plus récents</option>
        <option value="aboire">À boire d'abord</option>
        <option value="domaine">Domaine A → Z</option>
        <option value="millesime">Millésime ↑</option>
      </select>
    </div>
  </div>

  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden></p>

  <div class="tools">
    <button class="link" id="btnExport">Sauvegarder ma cave</button>
    <button class="link" id="btnImport">Restaurer une sauvegarde</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</main>

<div class="fabs">
  <button class="fab" id="btnAdd">+ Ajouter une bouteille</button>
  <button class="fab alt" id="btnLot" aria-label="Ajouter plusieurs bouteilles en photo">📸 En lot</button>
</div>

<dialog id="dlgLot">
  <div class="lot">
    <h2>Ajout en lot</h2>
    <p class="search-help">Placez 4 à 8 bouteilles debout, étiquettes bien visibles face à l'objectif. Vous pouvez ajouter plusieurs photos, une à une ou d'un coup.</p>
    <label class="photo-pick">
      <input type="file" id="lotPhotos" accept="image/*" multiple hidden>
      <span>📸 Prendre ou choisir des photos</span>
    </label>
    <p class="search-status" id="lotStatus" hidden></p>
    <div class="progress" id="lotProgress" hidden><div></div></div>
    <ul class="lot-list" id="lotList"></ul>
    <div class="actions">
      <button type="button" class="btn secondary" id="lotClose">Fermer</button>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="lotGo" hidden>Ajouter</button>
    </div>
  </div>
</dialog>

<dialog id="dlg">
  <form id="form" novalidate>
    <h2 id="dlgTitle">Nouvelle bouteille</h2>

    <label class="photo-pick">
      <input type="file" id="photo" accept="image/*" hidden>
      <img id="photoPreview" alt="Étiquette" hidden>
      <span id="photoHint">📷 Photographier l'étiquette<br><small>la fiche se remplit toute seule</small></span>
    </label>

    <div class="search-box">
      <div class="search-row">
        <input id="q" type="search" autocomplete="off" placeholder="ex. Jamet Côte-Rôtie 2015" aria-label="Rechercher ce vin">
        <button type="button" class="btn primary" id="btnSearch">🔍 Rechercher</button>
      </div>
      <p class="search-help" id="searchHelp">Ou tapez quelques mots. Recherche ≈ 20 à 30 s ; vérifiez la fiche avant d'enregistrer.</p>
      <p class="search-status" id="searchStatus" hidden></p>
    </div>

    <div class="fiche" id="fiche" hidden></div>

    <label class="f">Domaine / Château
      <input id="f-domaine" autocomplete="off" placeholder="ex. Domaine Jamet">
    </label>
    <label class="f">Cuvée (facultatif)
      <input id="f-cuvee" autocomplete="off" placeholder="ex. Côte Brune">
    </label>
    <div class="row">
      <label class="f">Appellation
        <input id="f-appellation" autocomplete="off" placeholder="ex. Côte-Rôtie">
      </label>
      <label class="f">Région
        <input id="f-region" autocomplete="off" placeholder="ex. Rhône Nord">
      </label>
    </div>
    <div class="row">
      <label class="f">Millésime
        <input id="f-millesime" type="number" inputmode="numeric" min="1900" max="2100" placeholder="vide = non millésimé">
      </label>
      <label class="f">Couleur
        <select id="f-couleur"></select>
      </label>
    </div>

    <label class="f">Nombre de bouteilles
      <div class="stepper">
        <button type="button" class="btn secondary" id="qMinus" aria-label="Moins">−</button>
        <input id="f-quantite" type="number" inputmode="numeric" min="0" value="1">
        <button type="button" class="btn secondary" id="qPlus" aria-label="Plus">+</button>
      </div>
    </label>

    <div class="row">
      <label class="f">À boire à partir de
        <input id="f-boireDe" type="number" inputmode="numeric" min="1900" max="2150" placeholder="année">
      </label>
      <label class="f">À boire jusqu'à
        <input id="f-boireA" type="number" inputmode="numeric" min="1900" max="2150" placeholder="année">
      </label>
    </div>
    <div class="row">
      <label class="f">Prix d'achat (€ / bouteille)
        <input id="f-prix" type="number" inputmode="decimal" min="0" step="0.5">
      </label>
      <label class="f">Emplacement
        <input id="f-emplacement" autocomplete="off" placeholder="ex. casier B3">
      </label>
    </div>
    <label class="f">Notes
      <textarea id="f-notes" rows="3" placeholder="Impressions, accords, d'où vient la bouteille…"></textarea>
    </label>

    <div class="actions">
      <button type="button" class="btn danger" id="btnDelete" hidden>Supprimer</button>
      <span class="spacer"></span>
      <button type="button" class="btn secondary" id="btnCancel">Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
/* =========================================================
   Ma Cave — V1
   Les données sont stockées dans le navigateur (IndexedDB).
   Elles restent sur cet appareil : pensez à « Sauvegarder ».
   ========================================================= */

const COULEURS = ['Rouge', 'Blanc', 'Rosé', 'Effervescent', 'Liquoreux'];
const API_RECHERCHE = 'https://axioguzxjiowpyvqmobo.supabase.co/functions/v1/chercher-vin';
// Informations trouvées par la recherche, gardées avec la bouteille
const CHAMPS_FICHE = ['pays', 'cepages', 'apogee', 'description', 'accords', 'service', 'prixMin', 'prixMax', 'confiance', 'sources'];
let ficheEnCours = null;
const $ = (sel) => document.querySelector(sel);

let bottles = [];        // toutes les bouteilles
let filtre = 'Tous';     // couleur sélectionnée
let editingId = null;    // id de la bouteille en cours de modification
let pendingPhoto = null; // photo choisie dans le formulaire

/* ---------- Stockage (IndexedDB) ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('ma-cave', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const dbPromise = openDB();
dbPromise.catch(() => {});

async function charger() {
  try {
    const db = await dbPromise;
    return await new Promise((resolve, reject) => {
      const req = db.transaction('kv').objectStore('kv').get('bottles');
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.warn('Lecture impossible', e);
    return [];
  }
}

async function enregistrer() {
  try {
    const db = await dbPromise;
    await new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(bottles, 'bottles');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    alert("Impossible d'enregistrer sur cet appareil : " + e.message);
  }
}

/* ---------- Outils ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sansAccent = (s) => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const slug = (s) => sansAccent(s).toLowerCase();
const norm = (s) => sansAccent(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const cleVin = (b) => [norm(b.domaine), norm(b.cuvee), norm(b.appellation), b.millesime || 'nm'].join('|');
const nouvelId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

// Réduit la photo (~1200 px) pour qu'elle prenne peu de place
function compresser(file, maxPx = 1200, qualite = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(1, maxPx / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', qualite));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image illisible')); };
    img.src = url;
  });
}

const fmtEuro = (n) => Math.round(n).toLocaleString('fr-FR') + ' €';
// Valeur estimée : milieu de la fourchette trouvée, sinon prix d'achat
function valeurUnitaire(b) {
  const min = Number(b.prixMin) || 0, max = Number(b.prixMax) || 0;
  if (min && max) return (min + max) / 2;
  return min || max || Number(b.prix) || 0;
}

// Statut de la fenêtre de dégustation
function statut(b) {
  const an = new Date().getFullYear();
  const de = Number(b.boireDe) || 0;
  const a = Number(b.boireA) || 0;
  if (!de && !a) return null;
  if (de && an < de) return { cls: 'tot', txt: `Trop tôt · dès ${de}` };
  if (a && an > a) return { cls: 'passe', txt: `À boire d'urgence · prévu jusqu'à ${a}` };
  if (a && an >= a - 1) return { cls: 'vite', txt: `À boire bientôt · jusqu'à ${a}` };
  return { cls: 'ok', txt: a ? `Prêt à boire · jusqu'à ${a}` : 'Prêt à boire' };
}

/* ---------- Affichage ---------- */
function carte(b) {
  const st = statut(b);
  const c = slug(b.couleur);
  const sousTitre = [b.appellation, b.millesime || 'NM'].filter(Boolean).join(' · ');
  return `
    <li class="card ${b.quantite <= 0 ? 'epuise' : ''}" data-id="${esc(b.id)}">
      <button class="card-main" data-act="edit">
        ${b.photo ? `<img src="${b.photo}" alt="">` : `<div class="ph c-${c}">🍷</div>`}
        <div class="info">
          <div class="name">${esc(b.domaine || b.appellation || 'Sans nom')}${b.cuvee ? ` <span class="cuvee">· ${esc(b.cuvee)}</span>` : ''}</div>
          <div class="sub"><span class="dot c-${c}"></span>${esc(sousTitre)}</div>
          ${st ? `<div class="badge ${st.cls}">${st.txt}</div>` : ''}
          ${b.emplacement ? `<div class="loc">📍 ${esc(b.emplacement)}</div>` : ''}
          ${valeurUnitaire(b) ? `<div class="valeur">≈ ${fmtEuro(valeurUnitaire(b))} / bouteille</div>` : ''}
        </div>
      </button>
      <div class="qty">
        <button data-act="plus" aria-label="Ajouter une bouteille">+</button>
        <span>${b.quantite}</span>
        <button data-act="moins" aria-label="J'en ai bu une">−</button>
      </div>
    </li>`;
}

function afficherChips() {
  const options = ['Tous', ...COULEURS];
  $('#chips').innerHTML = options.map((o) => {
    const n = o === 'Tous'
      ? bottles.reduce((s, b) => s + b.quantite, 0)
      : bottles.filter((b) => b.couleur === o).reduce((s, b) => s + b.quantite, 0);
    return `<button class="chip" data-c="${o}" aria-pressed="${o === filtre}">${o} · ${n}</button>`;
  }).join('');
}

function afficher() {
  const q = norm($('#search').value);
  const tri = $('#sort').value;

  let items = bottles.filter((b) =>
    (filtre === 'Tous' || b.couleur === filtre) &&
    (!q || norm([b.domaine, b.cuvee, b.appellation, b.region, b.millesime, b.emplacement].join(' ')).includes(q)));

  const comparateurs = {
    recent: (a, b) => b.ajoute - a.ajoute,
    domaine: (a, b) => (a.domaine || '').localeCompare(b.domaine || '', 'fr'),
    millesime: (a, b) => (Number(a.millesime) || 9999) - (Number(b.millesime) || 9999),
    aboire: (a, b) => (Number(a.boireA) || 9999) - (Number(b.boireA) || 9999),
  };
  items.sort(comparateurs[tri]);

  const groupe = $('#group').value;
  if (groupe === 'aucun') {
    $('#list').innerHTML = items.map(carte).join('');
  } else {
    const groupes = new Map();
    for (const b of items) {
      const k = cleGroupe(b, groupe);
      if (!groupes.has(k.cle)) groupes.set(k.cle, { ...k, vins: [] });
      groupes.get(k.cle).vins.push(b);
    }
    const ordonnes = [...groupes.values()].sort((a, b) =>
      a.ordre - b.ordre || a.titre.localeCompare(b.titre, 'fr'));
    $('#list').innerHTML = ordonnes.map((g) => {
      const n = g.vins.reduce((s, b) => s + b.quantite, 0);
      const v = g.vins.reduce((s, b) => s + (valeurUnitaire(b) || 0) * b.quantite, 0);
      return `<li class="group-h"><h3>${esc(g.titre)}</h3><span>${n} bout.${v ? ' · ≈ ' + fmtEuro(v) : ''}</span></li>`
        + g.vins.map(carte).join('');
    }).join('');
  }

  const vide = $('#empty');
  if (bottles.length === 0) {
    vide.hidden = false;
    vide.textContent = 'Votre cave est vide. Ajoutez votre première bouteille avec le bouton ci-dessous.';
  } else if (items.length === 0) {
    vide.hidden = false;
    vide.textContent = 'Aucune bouteille ne correspond à cette recherche.';
  } else {
    vide.hidden = true;
  }

  const total = bottles.reduce((s, b) => s + b.quantite, 0);
  const refs = bottles.filter((b) => b.quantite > 0).length;
  const valeur = bottles.reduce((s, b) => s + (valeurUnitaire(b) || 0) * b.quantite, 0);
  $('#stats').textContent = `${total} bouteille${total > 1 ? 's' : ''} · ${refs} vin${refs > 1 ? 's' : ''} différent${refs > 1 ? 's' : ''}`
    + (valeur ? ` · valeur estimée ≈ ${fmtEuro(valeur)}` : '');

  afficherChips();
}

// Clé de regroupement d'une bouteille (titre affiché + ordre des sections)
function cleGroupe(b, groupe) {
  if (groupe === 'producteur') {
    const t = (b.domaine || '').trim() || 'Producteur inconnu';
    return { cle: norm(t), titre: t, ordre: b.domaine ? 0 : 1 };
  }
  if (groupe === 'region') {
    const t = (b.region || '').trim() || 'Région inconnue';
    return { cle: norm(t), titre: t, ordre: b.region ? 0 : 1 };
  }
  if (groupe === 'couleur') {
    const i = COULEURS.indexOf(b.couleur);
    return { cle: b.couleur || '?', titre: b.couleur || 'Couleur inconnue', ordre: i < 0 ? 99 : i };
  }
  // À boire / à garder, d'après la fenêtre de dégustation
  const st = statut(b);
  if (!st) return { cle: 'inconnu', titre: 'Fenêtre de dégustation inconnue', ordre: 3 };
  if (st.cls === 'passe' || st.cls === 'vite') return { cle: 'urgent', titre: 'À boire en priorité', ordre: 0 };
  if (st.cls === 'ok') return { cle: 'pret', titre: 'Prêt à boire', ordre: 1 };
  return { cle: 'garder', titre: 'À garder', ordre: 2 };
}

/* ---------- Formulaire ---------- */
const CHAMPS = ['domaine', 'cuvee', 'appellation', 'region', 'millesime', 'couleur', 'quantite', 'boireDe', 'boireA', 'prix', 'emplacement', 'notes'];
$('#f-couleur').innerHTML = COULEURS.map((c) => `<option>${c}</option>`).join('');

function ouvrirFormulaire(b = null) {
  editingId = b ? b.id : null;
  pendingPhoto = null;
  $('#dlgTitle').textContent = b ? 'Modifier la bouteille' : 'Nouvelle bouteille';
  $('#btnDelete').hidden = !b;
  for (const k of CHAMPS) $('#f-' + k).value = b ? (b[k] ?? '') : '';
  if (!b) { $('#f-couleur').value = 'Rouge'; $('#f-quantite').value = 1; }
  montrerPhoto(b && b.photo);
  ficheEnCours = b && b.description ? Object.fromEntries(CHAMPS_FICHE.map((k) => [k, b[k]])) : null;
  afficherFiche(ficheEnCours);
  $('#q').value = '';
  statutRecherche('');
  $('#dlg').showModal();
}

function montrerPhoto(src) {
  $('#photoPreview').hidden = !src;
  $('#photoHint').hidden = !!src;
  if (src) $('#photoPreview').src = src;
}

function lireFormulaire() {
  const v = (k) => $('#f-' + k).value.trim();
  const annee = (k) => (v(k) ? parseInt(v(k), 10) : '');
  return {
    domaine: v('domaine'),
    cuvee: v('cuvee'),
    appellation: v('appellation'),
    region: v('region'),
    millesime: annee('millesime'),
    couleur: v('couleur'),
    quantite: Math.max(0, parseInt(v('quantite'), 10) || 0),
    boireDe: annee('boireDe'),
    boireA: annee('boireA'),
    prix: v('prix') ? Number(v('prix')) : '',
    emplacement: v('emplacement'),
    notes: v('notes'),
  };
}

/* ---------- Recherche du vin sur internet ---------- */
function statutRecherche(txt, erreur = false, enCours = false) {
  const el = $('#searchStatus');
  el.hidden = !txt;
  el.className = 'search-status' + (erreur ? ' err' : '');
  el.innerHTML = (enCours ? '<span class="spin"></span>' : '') + esc(txt);
}

function afficherFiche(f) {
  const el = $('#fiche');
  if (!f || !f.description) { el.hidden = true; el.innerHTML = ''; return; }
  const prix = f.prixMin && f.prixMax ? `${fmtEuro(f.prixMin)} – ${fmtEuro(f.prixMax)}` : (f.prixMin || f.prixMax ? fmtEuro(f.prixMin || f.prixMax) : '');
  const accords = Array.isArray(f.accords) ? f.accords : (f.accords ? [f.accords] : []);
  const sources = (Array.isArray(f.sources) ? f.sources : []).filter((u) => /^https?:\/\//.test(u)).slice(0, 4);
  el.innerHTML = `
    <div class="meta">
      ${f.cepages ? `<span class="pill">🍇 ${esc(f.cepages)}</span>` : ''}
      ${prix ? `<span class="pill">💶 ${prix}</span>` : ''}
      ${f.confiance ? `<span class="pill">Fiabilité : ${esc(f.confiance)}</span>` : ''}
    </div>
    <div><h3>Le vin</h3><p>${esc(f.description)}</p></div>
    ${f.apogee ? `<div><h3>Quand le boire</h3><p>${esc(f.apogee)}</p></div>` : ''}
    ${accords.length ? `<div><h3>Avec quoi</h3><ul>${accords.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}
    ${f.service ? `<div><h3>Service</h3><p>${esc(f.service)}</p></div>` : ''}
    ${sources.length ? `<div><h3>Sources</h3>${sources.map((u) => `<div><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`).join('')}</div>` : ''}`;
  el.hidden = false;
}

// Le code d'accès est demandé une fois puis mémorisé sur cet appareil
function codeAcces() {
  let code = '';
  try { code = localStorage.getItem('ma-cave-code') || ''; } catch {}
  if (!code) {
    code = (prompt('Code d\'accès pour la recherche :') || '').trim();
    if (code) { try { localStorage.setItem('ma-cave-code', code); } catch {} }
  }
  return code;
}
function oublierCode() {
  try { localStorage.removeItem('ma-cave-code'); } catch {}
}

// Appel à la fonction Supabase (recherche ou détection), avec gestion du code d'accès
async function appelerAPI(corps, code) {
  const r = await fetch(API_RECHERCHE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-code-acces': code },
    body: JSON.stringify(corps),
  });
  const f = await r.json().catch(() => ({}));
  if (r.status === 401) {
    oublierCode();
    throw new Error('code d\'accès incorrect. Réessayez pour le saisir à nouveau.');
  }
  if (!r.ok) throw new Error(f.erreur || f.message || `Erreur ${r.status}`);
  return f;
}

async function rechercherVin() {
  if ($('#btnSearch').disabled) return; // une recherche est déjà en cours
  let requete = $('#q').value.trim();
  // La photo de l'étiquette (si elle vient d'être prise) est envoyée avec la recherche
  const image = pendingPhoto || null;
  if (!requete && !image) {
    // Sinon, on utilise ce qui est déjà saisi dans le formulaire
    requete = ['domaine', 'cuvee', 'appellation', 'millesime'].map((k) => $('#f-' + k).value.trim()).filter(Boolean).join(' ');
  }
  if (!image && requete.length < 3) {
    statutRecherche('Prenez l\'étiquette en photo, ou tapez au moins le domaine ou l\'appellation.', true);
    return;
  }

  const code = codeAcces();
  if (!code) {
    statutRecherche('Un code d\'accès est nécessaire pour la recherche.', true);
    return;
  }

  const bouton = $('#btnSearch');
  bouton.disabled = true;
  statutRecherche(image ? 'Lecture de l\'étiquette et recherche sur internet…' : 'Recherche en cours sur internet…', false, true);
  try {
    const f = await appelerAPI(image ? { requete, image } : { requete }, code);
    if (!f.trouve) {
      statutRecherche(f.message || 'Vin introuvable. Essayez une photo plus nette ou tapez quelques mots.', true);
      return;
    }

    // Remplit le formulaire avec ce qui a été trouvé
    const remplir = (k, v) => { if (v !== null && v !== undefined && v !== '') $('#f-' + k).value = v; };
    remplir('domaine', f.domaine);
    remplir('cuvee', f.cuvee);
    remplir('appellation', f.appellation);
    remplir('region', f.region);
    remplir('millesime', f.millesime);
    if (COULEURS.includes(f.couleur)) $('#f-couleur').value = f.couleur;
    remplir('boireDe', f.boireDe);
    remplir('boireA', f.boireA);

    ficheEnCours = Object.fromEntries(CHAMPS_FICHE.map((k) => [k, f[k] ?? '']));
    afficherFiche(ficheEnCours);
    statutRecherche('✓ Fiche remplie. Vérifiez, choisissez le nombre de bouteilles, puis enregistrez.');
  } catch (err) {
    statutRecherche('La recherche a échoué : ' + err.message, true);
  } finally {
    bouton.disabled = false;
  }
}

$('#btnSearch').onclick = rechercherVin;
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); rechercherVin(); }
});

$('#photo').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    pendingPhoto = await compresser(file);
    montrerPhoto(pendingPhoto);
  } catch (err) {
    alert("Cette photo n'a pas pu être lue. Essayez avec une autre.");
    e.target.value = '';
    return;
  }
  e.target.value = '';
  // Nouvelle bouteille : on lance directement la recherche à partir de l'étiquette
  if (!editingId) rechercherVin();
});

$('#qMinus').onclick = () => { const i = $('#f-quantite'); i.value = Math.max(0, (parseInt(i.value, 10) || 0) - 1); };
$('#qPlus').onclick = () => { const i = $('#f-quantite'); i.value = (parseInt(i.value, 10) || 0) + 1; };
$('#btnCancel').onclick = () => $('#dlg').close();

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = { ...lireFormulaire(), ...(ficheEnCours || {}) };
  if (!data.domaine && !data.appellation) {
    alert("Indiquez au moins le domaine ou l'appellation.");
    return;
  }
  if (data.boireDe && data.boireA && data.boireDe > data.boireA) {
    alert("L'année « à partir de » doit être avant l'année « jusqu'à ».");
    return;
  }

  if (editingId) {
    const b = bottles.find((x) => x.id === editingId);
    Object.assign(b, data);
    if (pendingPhoto) b.photo = pendingPhoto;
  } else {
    // Même domaine + cuvée + appellation + millésime déjà en cave ? On propose de cumuler.
    const existant = bottles.find((b) => cleVin(b) === cleVin(data));
    if (existant && confirm(`Vous avez déjà ${existant.quantite} bouteille(s) de ce vin.\nAjouter ces ${data.quantite} bouteille(s) au même stock ?`)) {
      existant.quantite += data.quantite;
      if (pendingPhoto && !existant.photo) existant.photo = pendingPhoto;
    } else {
      bottles.push({ id: nouvelId(), ...data, photo: pendingPhoto, ajoute: Date.now() });
    }
  }
  await enregistrer();
  $('#dlg').close();
  afficher();
});

$('#btnDelete').onclick = async () => {
  if (!confirm('Supprimer définitivement ce vin de la cave ?')) return;
  bottles = bottles.filter((b) => b.id !== editingId);
  await enregistrer();
  $('#dlg').close();
  afficher();
};

/* ---------- Actions sur la liste ---------- */
$('#list').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = btn.closest('.card').dataset.id;
  const b = bottles.find((x) => x.id === id);
  if (!b) return;

  if (btn.dataset.act === 'edit') return ouvrirFormulaire(b);
  if (btn.dataset.act === 'plus') b.quantite += 1;
  if (btn.dataset.act === 'moins' && b.quantite > 0) {
    b.quantite -= 1;
    if (b.quantite === 0 && confirm('Dernière bouteille bue ! Retirer ce vin de la cave ?\n(Annuler pour le garder dans la liste.)')) {
      bottles = bottles.filter((x) => x.id !== id);
    }
  }
  await enregistrer();
  afficher();
});

$('#chips').addEventListener('click', (e) => {

  if (!c) return;
  filtre = c.dataset.c;
  afficher();
});
$('#search').addEventListener('input', afficher);
$('#sort').addEventListener('change', () => { memoriserVue(); afficher(); });
$('#group').addEventListener('change', () => { memoriserVue(); afficher(); });
// Le regroupement et le tri choisis sont retenus sur cet appareil
function memoriserVue() {
  try { localStorage.setItem('ma-cave-vue', JSON.stringify({ group: $('#group').value, sort: $('#sort').value })); } catch {}
}
try {
  const vue = JSON.parse(localStorage.getItem('ma-cave-vue') || '{}');

$('#btnAdd').onclick = () => ouvrirFormulaire();

/* ---------- Ajout en lot (plusieurs bouteilles par photo) ---------- */
let lot = [];          // vins détectés, en attente de validation
let lotOccupe = false; // détection ou ajout en cours

function lotStatut(txt, erreur = false, enCours = false) {
  const el = $('#lotStatus');
  el.hidden = !txt;
  el.className = 'search-status' + (erreur ? ' err' : '');
  el.innerHTML = (enCours ? '<span class="spin"></span>' : '') + esc(txt);
}
function lotProgression(fait, total) {
  $('#lotProgress').hidden = !total;
  $('#lotProgress div').style.width = total ? `${Math.round((fait / total) * 100)}%` : '0';
}

function afficherLot() {
  $('#lotList').innerHTML = lot.map((v, i) => `
    <li class="lot-item ${v.coche ? '' : 'off'}" data-i="${i}">
      <div class="lot-side">
        <input type="checkbox" data-k="coche" ${v.coche ? 'checked' : ''} aria-label="Ajouter ce vin" ${lotOccupe ? 'disabled' : ''}>
        ${v.miniature ? `<img src="${v.miniature}" alt="">` : ''}
      </div>
      <div class="lot-fields">
        <input data-k="domaine" value="${esc(v.domaine)}" placeholder="Domaine" ${lotOccupe ? 'disabled' : ''}>
        <div class="lot-row">
          <input data-k="appellation" value="${esc(v.appellation)}" placeholder="Appellation" ${lotOccupe ? 'disabled' : ''}>
          <input data-k="millesime" type="number" inputmode="numeric" value="${esc(v.millesime ?? '')}" placeholder="Millésime" ${lotOccupe ? 'disabled' : ''}>
        </div>
        <div class="lot-meta">
          <div class="lot-qty">
            <button type="button" data-act="moins" aria-label="Moins" ${lotOccupe ? 'disabled' : ''}>−</button>
            <span>${v.nombre}</span>
            <button type="button" data-act="plus" aria-label="Plus" ${lotOccupe ? 'disabled' : ''}>+</button>
          </div>
          ${v.cuvee ? `<span>${esc(v.cuvee)}</span>` : ''}
          ${v.certitude && v.certitude !== 'haute' ? `<span>Lecture ${esc(v.certitude)} — vérifiez</span>` : ''}
          ${v.position ? `<span>📍 ${esc(v.position)}</span>` : ''}
          ${v.etat === 'ok' ? '<span class="etat-ok">✓ ajouté</span>' : ''}
          ${v.etat === 'cours' ? '<span><span class="spin"></span>recherche…</span>' : ''}
          ${v.etat === 'err' ? '<span class="etat-err">ajouté sans fiche complète</span>' : ''}
        </div>
      </div>
    </li>`).join('');

  const choisis = lot.filter((v) => v.coche && !v.etat);
  const n = choisis.reduce((s, v) => s + v.nombre, 0);
  $('#lotGo').hidden = !choisis.length;
  $('#lotGo').disabled = lotOccupe;
  $('#lotGo').textContent = `Ajouter ${choisis.length} vin${choisis.length > 1 ? 's' : ''} (${n} bouteille${n > 1 ? 's' : ''})`;
}

$('#lotList').addEventListener('input', (e) => {
  const k = e.target.dataset.k;
  const i = e.target.closest('.lot-item')?.dataset.i;
  if (!k || i === undefined) return;
  const v = lot[i];
  if (k === 'coche') { v.coche = e.target.checked; afficherLot(); return; }
  v[k] = k === 'millesime' ? (parseInt(e.target.value, 10) || null) : e.target.value;
});
$('#lotList').addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  const v = lot[e.target.closest('.lot-item').dataset.i];
  v.nombre = Math.max(1, v.nombre + (act === 'plus' ? 1 : -1));
  afficherLot();
});

// 1) Détection des vins sur chaque photo choisie
$('#lotPhotos').addEventListener('change', async (e) => {
  const fichiers = [...e.target.files];
  e.target.value = '';
  if (!fichiers.length || lotOccupe) return;
  const code = codeAcces();
  if (!code) { lotStatut('Un code d\'accès est nécessaire.', true); return; }

  lotOccupe = true;
  afficherLot();
  let trouves = 0, illisibles = 0, echecs = 0;
  for (let n = 0; n < fichiers.length; n++) {
    lotStatut(`Lecture des étiquettes… photo ${n + 1} sur ${fichiers.length}`, false, true);
    lotProgression(n, fichiers.length);
    try {
      const image = await compresser(fichiers[n], 1600, 0.85);
      const miniature = await compresser(fichiers[n], 500, 0.75);
      const res = await appelerAPI({ mode: 'detecter', image }, code);
      illisibles += res.nonIdentifiees || 0;
      for (const v of res.vins || []) {
        const vin = {
          domaine: v.domaine || '', cuvee: v.cuvee || '', appellation: v.appellation || '',
          millesime: Number(v.millesime) || null, couleur: v.couleur || '',
          nombre: Number(v.nombre) || 1, certitude: v.certitude || '', position: v.position || '',
          miniature, coche: true, etat: '',
        };
        // Même vin déjà détecté sur une autre photo ? On additionne.
        const deja = lot.find((x) => !x.etat && cleVin(x) === cleVin(vin));
        if (deja) deja.nombre += vin.nombre; else { lot.push(vin); trouves++; }
      }
    } catch (err) {
      echecs++;
      if (/code d'accès/.test(err.message)) { lotStatut('La recherche a échoué : ' + err.message, true); break; }
    }
    afficherLot();
  }
  lotOccupe = false;
  lotProgression(0, 0);
  afficherLot();
  if (!/code d'accès/.test($('#lotStatus').textContent)) {
    const msg = [`${trouves} vin${trouves > 1 ? 's' : ''} repéré${trouves > 1 ? 's' : ''}.`];
    if (illisibles) msg.push(`${illisibles} bouteille${illisibles > 1 ? 's' : ''} illisible${illisibles > 1 ? 's' : ''} (à ajouter à la main ou à reprendre en photo).`);
    if (echecs) msg.push(`${echecs} photo${echecs > 1 ? 's' : ''} n'a pas pu être lue.`);
    if (trouves) msg.push('Vérifiez la liste, corrigez si besoin, puis appuyez sur « Ajouter ».');
    lotStatut(msg.join(' '), !trouves);
  }
});

// 2) Recherche internet pour chaque vin retenu, puis ajout à la cave
$('#lotGo').onclick = async () => {
  const choisis = lot.filter((v) => v.coche && !v.etat);
  if (!choisis.length || lotOccupe) return;
  const code = codeAcces();
  if (!code) return;

  lotOccupe = true;
  let fait = 0, cumules = 0, incomplets = 0;
  const total = choisis.length;
  lotStatut(`Recherche des fiches… 0 sur ${total}`, false, true);
  lotProgression(0, total);

  const traiter = async (v) => {
    v.etat = 'cours';
    afficherLot();
    let fiche = null;
    try {
      const requete = [v.domaine, v.cuvee, v.appellation, v.millesime].filter(Boolean).join(' ');
      const f = await appelerAPI({ requete }, code);
      if (f.trouve) fiche = f;
    } catch { /* on ajoute quand même le vin avec ce qui a été lu */ }

    const b = {
      domaine: fiche?.domaine || v.domaine,
      cuvee: fiche?.cuvee ?? v.cuvee,
      appellation: fiche?.appellation || v.appellation,
      region: fiche?.region || '',
      millesime: v.millesime || Number(fiche?.millesime) || '',
      couleur: COULEURS.includes(fiche?.couleur) ? fiche.couleur : (COULEURS.includes(v.couleur) ? v.couleur : 'Rouge'),
      quantite: v.nombre,
      boireDe: Number(fiche?.boireDe) || '',
      boireA: Number(fiche?.boireA) || '',
      prix: '', emplacement: '', notes: '',
      ...(fiche ? Object.fromEntries(CHAMPS_FICHE.map((k) => [k, fiche[k] ?? ''])) : {}),
    };
    const existant = bottles.find((x) => cleVin(x) === cleVin(b));
    if (existant) {
      existant.quantite += b.quantite;
      cumules++;
    } else {
      bottles.push({ id: nouvelId(), ...b, photo: v.miniature || null, ajoute: Date.now() });
    }
    if (!fiche) incomplets++;
    v.etat = fiche ? 'ok' : 'err';
    fait++;
    lotStatut(`Recherche des fiches… ${fait} sur ${total}`, false, true);
    lotProgression(fait, total);
    afficherLot();
  };

  // 3 recherches en parallèle maximum
  const file = [...choisis];
  await Promise.all([1, 2, 3].map(async () => {
    while (file.length) await traiter(file.shift());
  }));

  await enregistrer();
  afficher();
  lotOccupe = false;
  lotProgression(0, 0);
  afficherLot();
  const msg = [`✓ ${total} vin${total > 1 ? 's' : ''} ajouté${total > 1 ? 's' : ''} à la cave.`];
  if (cumules) msg.push(`${cumules} déjà présent${cumules > 1 ? 's' : ''} : quantités additionnées.`);
  if (incomplets) msg.push(`${incomplets} sans fiche complète : ouvrez-le${incomplets > 1 ? 's' : ''} et relancez 🔍 Rechercher.`);
  lotStatut(msg.join(' '), false);
};

$('#btnLot').onclick = () => {
  if (!lotOccupe) {
    lot = [];
    lotStatut('');
    lotProgression(0, 0);
    afficherLot();
  }
  $('#dlgLot').showModal();
};
$('#lotClose').onclick = () => $('#dlgLot').close();

/* ---------- Sauvegarde / restauration ---------- */
$('#btnExport').onclick = () => {
  const contenu = JSON.stringify({ version: 1, exporte: new Date().toISOString(), bouteilles: bottles });
  const url = URL.createObjectURL(new Blob([contenu], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `ma-cave-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

$('#btnImport').onclick = () => $('#importFile').click();
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    const liste = Array.isArray(d) ? d : d.bouteilles;
    if (!Array.isArray(liste)) throw new Error('format');
    if (!confirm(`Remplacer votre cave actuelle par cette sauvegarde (${liste.length} vins) ?`)) return;
    bottles = liste.map((b) => ({ ...b, id: b.id || nouvelId(), quantite: Number(b.quantite) || 0, ajoute: b.ajoute || Date.now() }));
    await enregistrer();
    afficher();
  } catch {
    alert("Ce fichier n'est pas une sauvegarde valide de Ma Cave.");
  }
});

/* ---------- Mise à jour automatique ---------- */
// À l'ouverture, on compare la version affichée avec celle en ligne ;
// si elle est plus récente, on recharge la page en contournant le cache.
async function verifierMiseAJour() {
  try {
    const actuelle = document.querySelector('meta[name="app-version"]').content;
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    const html = await r.text();
    const enLigne = (html.match(/name="app-version" content="([^"]+)"/) || [])[1];
    if (enLigne && enLigne !== actuelle && sessionStorage.getItem('maj-tentee') !== enLigne) {
      sessionStorage.setItem('maj-tentee', enLigne);
      location.replace(location.pathname + '?v=' + encodeURIComponent(enLigne));
    }
  } catch { /* hors ligne : on garde la version actuelle */ }
}
if (location.protocol.startsWith('http')) {
  verifierMiseAJour();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) verifierMiseAJour(); });
}

/* ---------- Démarrage ---------- */
(async () => {
  bottles = await charger();
  afficher();
})();
</script>
